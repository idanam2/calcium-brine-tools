<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<title>מחשבון תמלחת קלציום</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--ink:#14202e;--mut:#5b6b7d;--pri:#0f6cbd;--pri-ink:#fff;
  --line:#d3dce6;--ok:#12805c;--warn:#b45309;--bad:#b42318;--soft:#e8f1fb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f151c;--card:#18212b;--ink:#e8eef5;--mut:#9aabbd;--line:#2c3947;--pri:#4aa3f0;--pri-ink:#06121e;--ok:#4ad0a0;--warn:#f0a94a;--bad:#ff8a80;--soft:#1d2b3a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;
  padding:0 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--pri);color:var(--pri-ink);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.9}
#gear{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:12px;width:46px;height:46px;font-size:22px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card[hidden]{display:none}
h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text]{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font-size:18px;background:var(--bg);color:var(--ink);text-align:center;direction:ltr}
input[type=text]:focus{outline:none;border-color:var(--pri)}
button{font:inherit;cursor:pointer}
.rowhead,.row{display:grid;grid-template-columns:34px 1fr 1.2fr 46px;gap:8px;align-items:center}
.rowhead{font-size:13px;color:var(--mut);text-align:center;margin-bottom:4px}
.row{margin-bottom:8px}
.chip{background:var(--soft);color:var(--pri);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700}
.del{height:46px;width:46px;border:1.5px solid var(--line);background:transparent;color:var(--bad);border-radius:12px;font-size:20px}
.btn{width:100%;height:50px;border-radius:12px;border:1.5px dashed var(--pri);background:transparent;color:var(--pri);font-size:17px;font-weight:600;margin-top:2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.line>span{font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;border-radius:12px;border:0;background:var(--soft);color:var(--pri);font-size:26px;font-weight:700}
.stepper b{min-width:30px;text-align:center;font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.reset{margin-top:12px;height:44px;width:100%;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--mut)}
.batch{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.batch .bt{font-weight:700;margin-bottom:8px}
.batch ol{margin:0;padding:0 22px 0 0}
.batch li{margin-bottom:8px;font-size:18px}
.batch li b{color:var(--pri);font-size:20px}
.fin{margin-top:10px;padding:10px;border-radius:12px;background:var(--soft);font-weight:600}
.left{font-size:15px;color:var(--mut);margin-top:6px}
.msg{padding:12px;border-radius:12px;background:var(--soft)}
.msg.bad{color:var(--bad);border:1.5px solid var(--bad);background:transparent}
.fix{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft);font-size:18px}
.fix b{color:var(--pri);font-size:20px}
.fix.ok{color:var(--ok)}
.fix .w{color:var(--warn);font-size:15px;margin-top:6px}
footer{font-size:13px;color:var(--mut);text-align:center;margin-top:6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>מחשבון תמלחת קלציום</h1>
    <div class="sub" id="goal"></div>
  </div>
  <button id="gear" aria-label="הגדרות" title="הגדרות">⚙</button>
</header>

<main>
  <section class="card" id="settings" hidden>
    <h2>הגדרות</h2>
    <div class="set">
      <div><label for="sT">בומה יעד</label><input type="text" inputmode="decimal" id="sT"></div>
      <div><label for="sTol">סבילות בומה ±</label><input type="text" inputmode="decimal" id="sTol"></div>
      <div><label for="sRange">טווח כמות ± (ליטר)</label><input type="text" inputmode="decimal" id="sRange"></div>
      <div><label for="sCap">נפח קובייה (ליטר)</label><input type="text" inputmode="decimal" id="sCap"></div>
    </div>
    <div class="hint">ההגדרות נשמרות בדפדפן של הטלפון הזה.</div>
    <button class="reset" id="reset">איפוס לברירת מחדל</button>
  </section>

  <section class="card">
    <h2>מה יש לי</h2>
    <div class="rowhead"><span></span><span>בומה</span><span>ליטר</span><span></span></div>
    <div id="rows"></div>
    <button class="btn" id="add">+ הוסף מיכל</button>
    <div class="line">
      <span>קוביות ריקות</span>
      <div class="stepper"><button data-st="e-" aria-label="פחות">−</button><b id="eV">1</b><button data-st="e+" aria-label="יותר">+</button></div>
    </div>
  </section>

  <section class="card">
    <h2>מה אני צריך</h2>
    <div class="two">
      <div><label for="per">ליטר בכל קובייה</label><input type="text" inputmode="decimal" id="per" value="900"></div>
      <div><label>כמה קוביות</label>
        <div class="stepper"><button data-st="c-" aria-label="פחות">−</button><b id="cV">1</b><button data-st="c+" aria-label="יותר">+</button></div>
      </div>
    </div>
    <div class="hint" id="rangeHint"></div>
  </section>

  <section class="card">
    <h2>מה לעשות</h2>
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>מדדתי — תיקון</h2>
    <div class="two">
      <div><label for="mB">בומה שמדדתי</label><input type="text" inputmode="decimal" id="mB" placeholder="למשל 33.5"></div>
      <div><label for="mV">ליטר בקובייה</label><input type="text" inputmode="decimal" id="mV"></div>
    </div>
    <div id="fix"></div>
  </section>

  <footer>החישוב בקירוב. תמיד למדוד עם ארומטר אחרי הערבוב.</footer>
</main>

<script>
// ===SOLVER START===
function sg(b){return 145/(145-b);}
function bomeOf(s){return 145-145/s;}

function combos(n,k){
  var out=[];
  (function rec(start,cur){
    if(cur.length===k){out.push(cur.slice());return;}
    for(var i=start;i<n;i++){cur.push(i);rec(i+1,cur);cur.pop();}
  })(0,[]);
  return out;
}

// P: {sources:[{id,label,b,l}], empties, T, per, range, cap, tol}
function solveBatch(P){
  var sources=P.sources,empties=P.empties,T=P.T,per=P.per,range=P.range,cap=P.cap,tol=P.tol;
  var sgT=sg(T);
  var Vlo=Math.max(1,per-range),Vhi=Math.min(per+range,cap);
  if(Vlo>Vhi)return null;
  var Vs=[],off,V;
  for(off=0;off<=range+5;off+=5){
    [per-off,per+off].forEach(function(v){
      if(v>=Vlo-1e-9&&v<=Vhi+1e-9&&Vs.indexOf(v)<0)Vs.push(v);
    });
  }
  [Vlo,Vhi].forEach(function(v){if(Vs.indexOf(v)<0)Vs.push(v);});

  var dests=[];
  if(empties>0)dests.push({id:'empty',empty:true,base:0,sg:sgT});
  sources.forEach(function(s){dests.push({id:s.id,empty:false,base:s.l,sg:sg(s.b),src:s});});

  var best=null;

  function two(S,R,d1,d2,av1,av2){
    if(Math.abs(d1-d2)<1e-9)return null;
    var a1=(R-S*d2)/(d1-d2),a2=S-a1;
    if(a1>=1&&a2>=1&&a1<=av1+1e-9&&a2<=av2+1e-9)return [a1,a2];
    return null;
  }

  function attempt(base,dd,it){
    var k=it.length,R=-base*dd;
    var d=it.map(function(x){return x.sg-sgT;});
    var i,j,S,r,a,a3;
    if(k===0){
      if(base<=0)return null;
      return (Math.abs(bomeOf(sgT+dd)-T)<=tol&&base>=Vlo&&base<=Vhi)?[]:null;
    }
    if(k===1){
      if(Math.abs(d[0])<1e-9){
        if(Math.abs(R)>1e-6)return null;
        for(i=0;i<Vs.length;i++){a=Vs[i]-base;if(a>=1&&a<=it[0].avail)return [a];}
        return null;
      }
      a=R/d[0];V=base+a;
      if(a>=1&&a<=it[0].avail&&V>=Vlo-1e-9&&V<=Vhi+1e-9)return [a];
      return null;
    }
    if(k===2){
      for(i=0;i<Vs.length;i++){
        S=Vs[i]-base;if(S<2)continue;
        r=two(S,R,d[0],d[1],it[0].avail,it[1].avail);
        if(r)return r;
      }
      return null;
    }
    for(i=0;i<Vs.length;i++){
      var S0=Vs[i]-base;
      for(a3=5;a3<=Math.min(it[2].avail,S0-2);a3+=5){
        r=two(S0-a3,R-a3*d[2],d[0],d[1],it[0].avail,it[1].avail);
        if(r)return r.concat([a3]);
      }
    }
    return null;
  }

  dests.forEach(function(dest){
    var items=[];
    sources.forEach(function(s){
      if(s.id!==dest.id)items.push({id:s.id,label:s.label,b:s.b,sg:sg(s.b),avail:s.l,water:false});
    });
    items.push({id:'water',label:'מים',b:0,sg:1,avail:cap,water:true});
    var dd=dest.empty?0:dest.sg-sgT;
    for(var k=0;k<=3;k++){
      combos(items.length,k).forEach(function(c){
        var it=c.map(function(i){return items[i];});
        var raw=attempt(dest.base,dd,it);
        if(!raw)return;
        var amts=raw.map(Math.round);
        var ok=true,mass=dest.base*dest.sg,vol=dest.base;
        amts.forEach(function(a,i){
          if(a<1||a>it[i].avail)ok=false;
          mass+=a*it[i].sg;vol+=a;
        });
        if(!ok||vol>cap+1e-9||vol<Vlo-0.5||vol>Vhi+0.5)return;
        var bf=k===0?bomeOf(dest.sg):bomeOf(mass/vol);
        if(Math.abs(bf-T)>tol+1e-9)return;
        var hasW=it.some(function(x){return x.water;});
        var cost=it.filter(function(x){return !x.water;}).length+(hasW?0.3:0);
        var key=[cost,Math.abs(vol-per),k];
        if(best){
          for(var q=0;q<3;q++){
            if(key[q]<best.key[q]){break;}
            if(key[q]>best.key[q]){return;}
          }
          if(q===3)return;
        }
        var pours=it.map(function(x,i){return {id:x.id,label:x.label,b:x.b,water:x.water,amt:amts[i]};});
        pours.sort(function(a,b){return a.water-b.water||b.amt-a.amt;});
        best={key:key,dest:dest,pours:pours,V:vol,b:bf,cost:cost};
      });
    }
  });
  return best;
}

// P: solveBatch fields + cubes
function planAll(P){
  var inv=P.sources.map(function(s){return {id:s.id,label:s.label,b:s.b,l:s.l};});
  var empties=P.empties,usedEmpty=0,batches=[],i;
  for(i=0;i<P.cubes;i++){
    var sol=solveBatch({sources:inv,empties:empties,T:P.T,per:P.per,range:P.range,cap:P.cap,tol:P.tol});
    if(!sol){batches.push({fail:true});break;}
    sol.pours.forEach(function(p){
      if(p.water)return;
      inv.forEach(function(s){if(s.id===p.id)s.l-=p.amt;});
    });
    if(sol.dest.empty){empties--;usedEmpty++;sol.emptyNo=usedEmpty;}
    else{
      sol.destInit={label:sol.dest.src.label,b:sol.dest.src.b,l:sol.dest.src.l};
      inv=inv.filter(function(s){return s.id!==sol.dest.id;});
    }
    batches.push(sol);
  }
  return {batches:batches,inv:inv,emptiesLeft:empties};
}
// ===SOLVER END===

var DEF={T:32.2,tol:0.2,range:50,cap:1000};
var S={rows:[{b:'',l:''},{b:'',l:''}],empties:1,cubes:1,set:{T:DEF.T,tol:DEF.tol,range:DEF.range,cap:DEF.cap}};
var LET='אבגדהוזחטיכלמנסעפצקרשת';
var last=null;

function $(id){return document.getElementById(id);}
function num(v){var x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:NaN;}
function fb(b){return String(Math.round(b*10)/10);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

try{
  var saved=JSON.parse(localStorage.getItem('ca-calc-set')||'null');
  if(saved){['T','tol','range','cap'].forEach(function(k){if(isFinite(saved[k])&&saved[k]>0)S.set[k]=saved[k];});}
}catch(e){}
function saveSet(){try{localStorage.setItem('ca-calc-set',JSON.stringify(S.set));}catch(e){}}

function renderSettings(){
  $('sT').value=S.set.T;$('sTol').value=S.set.tol;$('sRange').value=S.set.range;$('sCap').value=S.set.cap;
  $('goal').textContent='יעד: '+fb(S.set.T)+'° בומה';
}

function renderRows(){
  var box=$('rows');box.innerHTML='';
  S.rows.forEach(function(r,i){
    var row=document.createElement('div');row.className='row';
    var chip=document.createElement('div');chip.className='chip';chip.textContent=LET[i]||(i+1);
    var b=document.createElement('input');b.type='text';b.inputMode='decimal';b.placeholder='41';b.value=r.b;b.setAttribute('aria-label','בומה מיכל '+(LET[i]||i+1));
    var l=document.createElement('input');l.type='text';l.inputMode='decimal';l.placeholder='500';l.value=r.l;l.setAttribute('aria-label','ליטר מיכל '+(LET[i]||i+1));
    var d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','מחק מיכל');
    b.addEventListener('input',function(){r.b=b.value;calc();});
    l.addEventListener('input',function(){r.l=l.value;calc();});
    d.addEventListener('click',function(){S.rows.splice(i,1);renderRows();calc();});
    row.appendChild(chip);row.appendChild(b);row.appendChild(l);row.appendChild(d);
    box.appendChild(row);
  });
}

function validSources(){
  var out=[];
  S.rows.forEach(function(r,i){
    var b=num(r.b),l=num(r.l);
    if(isFinite(b)&&isFinite(l)&&b>=0&&b<60&&l>0)out.push({id:'t'+i,label:LET[i]||String(i+1),b:b,l:l});
  });
  return out;
}

function tankRef(label){return 'מיכל '+label;}

function calc(){
  var T=S.set.T,per=num($('per').value);
  var range=S.set.range,cap=S.set.cap;
  $('eV').textContent=S.empties;$('cV').textContent=S.cubes;
  $('rangeHint').textContent=isFinite(per)?('אפשר בין '+Math.max(0,Math.round(per-range))+' ל-'+Math.min(Math.round(per+range),cap)+' ליטר בכל קובייה.'):'';
  var res=$('result');
  var srcs=validSources();
  last=null;
  if(!srcs.length){res.innerHTML='<div class="msg">הכניסו למעלה בומה וליטרים של כל מיכל שיש לכם.</div>';updateFix();return;}
  if(!isFinite(per)||per<=0){res.innerHTML='<div class="msg">כתבו כמה ליטר צריך בכל קובייה.</div>';updateFix();return;}
  var plan=planAll({sources:srcs,empties:S.empties,cubes:S.cubes,T:T,per:per,range:range,cap:cap,tol:S.set.tol});
  last={plan:plan,srcs:srcs};
  var html='';
  plan.batches.forEach(function(sol,bi){
    if(sol.fail){
      html+='<div class="msg bad">'+(bi>0?'לקובייה '+(bi+1)+' ':'')+'לא מצאתי דרך להגיע ל-'+fb(T)+'° עם מה שיש (עד 3 פעולות). צריך תמלחת חזקה מ-'+fb(T)+'° (אפשר להחליש עם מים), מספיק נפח, או אולי עוד קובייה ריקה. אפשר גם להרחיב את טווח הכמות בהגדרות.</div>';
      return;
    }
    var title;
    if(sol.dest.empty)title='קובייה ריקה'+(S.empties>1?' '+sol.emptyNo:'');
    else title=tankRef(sol.destInit.label)+' (יש בו כבר '+Math.round(sol.destInit.l)+' ליטר בבומה '+fb(sol.destInit.b)+')';
    var destShort=sol.dest.empty?title:tankRef(sol.destInit.label);
    html+='<div class="batch"><div class="bt">'+(S.cubes>1?'קובייה '+(bi+1)+' · ':'')+'מערבבים ב: '+esc(title)+'</div>';
    if(!sol.pours.length){
      html+='<div>'+esc(tankRef(sol.destInit.label))+' כבר בבומה '+fb(sol.destInit.b)+'. אין צורך לערבב.</div>';
    }else{
      html+='<ol>';
      sol.pours.forEach(function(p){
        if(p.water)html+='<li>הוסיפו <b>'+p.amt+'</b> ליטר מים אל '+esc(destShort)+'</li>';
        else html+='<li>העבירו <b>'+p.amt+'</b> ליטר מתוך '+esc(tankRef(p.label))+' ('+fb(p.b)+'°) אל '+esc(destShort)+'</li>';
      });
      html+='</ol>';
    }
    html+='<div class="fin">יתקבלו כ-'+Math.round(sol.V)+' ליטר בבומה '+(Math.round(sol.b*10)/10).toFixed(1)+'</div></div>';
  });
  var okAll=plan.batches.length&&!plan.batches[plan.batches.length-1].fail;
  var left=plan.inv.filter(function(s){return s.l>=1;});
  if(plan.batches.some(function(x){return !x.fail;})){
    var parts=left.map(function(s){return tankRef(s.label)+': '+Math.round(s.l)+' ליטר ('+fb(s.b)+'°)';});
    if(plan.emptiesLeft>0)parts.push('קוביות ריקות: '+plan.emptiesLeft);
    if(parts.length)html+='<div class="left"><b>נשאר:</b> '+parts.join(' · ')+'</div>';
  }
  res.innerHTML=html;
  var first=plan.batches[0];
  $('mV').placeholder=(first&&!first.fail)?String(Math.round(first.V)):'';
  updateFix();
}

function updateFix(){
  var out=$('fix'),T=S.set.T,cap=S.set.cap;
  var m=num($('mB').value);
  if(!isFinite(m)||m<=0||m>=60){out.innerHTML='';return;}
  var V=num($('mV').value);
  if(!isFinite(V)||V<=0)V=num($('mV').placeholder);
  if(!isFinite(V)||V<=0){out.innerHTML='<div class="fix">כתבו כמה ליטר יש בקובייה.</div>';return;}
  if(Math.abs(m-T)<=S.set.tol){out.innerHTML='<div class="fix ok">בטווח. אין צורך בתיקון.</div>';return;}
  var sgT=sg(T),sgM=sg(m),html,x,newV,warn='';
  if(m>T){
    x=V*(sgM-sgT)/(sgT-1);
    newV=V+x;
    html='הוסיפו <b>'+Math.round(x)+'</b> ליטר מים. יהיו כ-'+Math.round(newV)+' ליטר.';
  }else{
    var pool=(last&&last.plan)?last.plan.inv.filter(function(s){return s.l>=1;}):[];
    if(!pool.length&&last)pool=last.srcs;
    var strong=pool.filter(function(s){return s.b>T+0.05;}).sort(function(a,b){return b.b-a.b;})[0];
    if(!strong){out.innerHTML='<div class="fix">צריך תמלחת חזקה מ-'+fb(T)+'° כדי להעלות את הבומה, ואין כזו בין המיכלים שנשארו.</div>';return;}
    x=V*(sgT-sgM)/(sg(strong.b)-sgT);
    newV=V+x;
    html='הוסיפו <b>'+Math.round(x)+'</b> ליטר מתוך '+esc(tankRef(strong.label))+' ('+fb(strong.b)+'°). יהיו כ-'+Math.round(newV)+' ליטר.';
    if(strong.l<x)warn+='<div class="w">במיכל הזה נשארו רק '+Math.round(strong.l)+' ליטר.</div>';
  }
  if(newV>cap)warn+='<div class="w">לא ייכנס בקובייה של '+cap+' ליטר. אפשר לעבור לקובייה אחרת או להוסיף פחות ולמדוד שוב.</div>';
  out.innerHTML='<div class="fix">'+html+warn+'</div>';
}

// wiring
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-st]');if(!t)return;
  var a=t.getAttribute('data-st');
  if(a==='e-')S.empties=Math.max(0,S.empties-1);
  if(a==='e+')S.empties=Math.min(5,S.empties+1);
  if(a==='c-')S.cubes=Math.max(1,S.cubes-1);
  if(a==='c+')S.cubes=Math.min(5,S.cubes+1);
  calc();
});
$('add').addEventListener('click',function(){
  if(S.rows.length>=12)return;
  S.rows.push({b:'',l:''});renderRows();calc();
  var ins=$('rows').querySelectorAll('input');if(ins.length>=2)ins[ins.length-2].focus();
});
$('gear').addEventListener('click',function(){var s=$('settings');s.hidden=!s.hidden;});
['per','mB','mV'].forEach(function(id){$(id).addEventListener('input',function(){id==='per'?calc():updateFix();});});
[['sT','T'],['sTol','tol'],['sRange','range'],['sCap','cap']].forEach(function(p){
  $(p[0]).addEventListener('input',function(){
    var v=num($(p[0]).value);
    if(isFinite(v)&&v>0){S.set[p[1]]=v;saveSet();$('goal').textContent='יעד: '+fb(S.set.T)+'° בומה';calc();}
  });
});
$('reset').addEventListener('click',function(){
  S.set={T:DEF.T,tol:DEF.tol,range:DEF.range,cap:DEF.cap};saveSet();renderSettings();calc();
});

renderSettings();renderRows();calc();
</script>
</body>
</html>
